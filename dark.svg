<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%" style="background:transparent; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="accent-grad-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED; #22D3EE; #10B981; #7C3AED" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE; #10B981; #7C3AED; #22D3EE" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981; #7C3AED; #22D3EE; #10B981" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="ascii-grad-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Glass Panel Backgrounds -->
    <linearGradient id="panel-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Shimmer Border Gradient -->
    <linearGradient id="border-shimmer-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.8">
        <animate attributeName="stop-opacity" values="0.2; 0.9; 0.2" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-shadow-dark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Ambient Floating Orbs -->
    <radialGradient id="orb-purple-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-cyan-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <!-- Scanline Mask -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-opacity="0.3" stroke-width="1.5"/>
    </pattern>

    <clipPath id="phrase-clipper">
      <rect x="0" y="-2" width="550" height="26"/>
    </clipPath>

    <style>
      .mono { font-family: 'Fira Code', 'Courier New', Courier, monospace; }
      .pill { transition: all 0.3s ease; cursor: pointer; }
      .pill:hover { filter: url(#glow-dark); }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1180" height="610" rx="24" fill="url(#bg-grad-dark)"/>

  <!-- Ambient Glowing Background Orbs -->
  <circle cx="200" cy="150" r="250" fill="url(#orb-purple-dark)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 30,20; 0,0" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="450" r="300" fill="url(#orb-cyan-dark)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -40,-30; 0,0" dur="15s" repeatCount="indefinite"/>
  </circle>

  <!-- Particle Stars -->
  <g opacity="0.6">
    <circle cx="120" cy="80" r="1.5" fill="#22D3EE"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="40" r="1" fill="#F8FAFC"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="120" r="1.5" fill="#10B981"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="550" r="1.2" fill="#7C3AED"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Outer Glass Frame -->
  <rect x="20" y="20" width="1140" height="570" rx="20" fill="none" stroke="url(#border-shimmer-dark)" stroke-width="1.5" filter="url(#soft-shadow-dark)"/>

  <!-- ==================== LEFT SIDE: CYBER TERMINAL (38%) ==================== -->
  <g transform="translate(40, 40)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="6s" repeatCount="indefinite" ease="easeInOut"/>
      
      <!-- Panel Base -->
      <rect width="410" height="530" rx="16" fill="url(#panel-grad-dark)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      
      <!-- Glass Highlight Header -->
      <path d="M 0 16 A 16 16 0 0 1 16 0 L 394 0 A 16 16 0 0 1 410 16 L 410 40 L 0 40 Z" fill="rgba(255,255,255,0.03)"/>
      <line x1="0" y1="40" x2="410" y2="40" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

      <!-- Window Controls -->
      <circle cx="25" cy="20" r="5" fill="#EF4444" opacity="0.8"/>
      <circle cx="40" cy="20" r="5" fill="#F59E0B" opacity="0.8"/>
      <circle cx="55" cy="20" r="5" fill="#10B981" opacity="0.8"/>
      <text x="205" y="24" fill="#94A3B8" font-size="11" text-anchor="middle" class="mono" opacity="0.7">terminal.sys — 80x24</text>

      <!-- Stable Cyber Terminal Display -->
      <g transform="translate(35, 70)" class="mono">
        <text x="0" y="30" fill="url(#ascii-grad-dark)" font-size="34" font-weight="900" letter-spacing="4">DEVELOPER</text>
        <text x="0" y="52" fill="#94A3B8" font-size="11" letter-spacing="2" opacity="0.8">// SYSTEM PROFILE</text>
        
        <line x1="0" y1="68" x2="340" y2="68" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

        <!-- System Status Box -->
        <g transform="translate(0, 85)" font-size="12">
          <rect x="0" y="0" width="340" height="175" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)"/>
          
          <text x="20" y="30" fill="#22D3EE" font-weight="600">[ CORE METRICS ]</text>
          
          <text x="20" y="60" fill="#94A3B8">ROLE       : <tspan fill="#F8FAFC">Middle PHP Engineer</tspan></text>
          <text x="20" y="85" fill="#94A3B8">STACK      : <tspan fill="#F8FAFC">Laravel / Node.js / SQL</tspan></text>
          <text x="20" y="110" fill="#94A3B8">DOMAINS    : <tspan fill="#F8FAFC">Backend / AI Integrations</tspan></text>
          <text x="20" y="135" fill="#94A3B8">INFRA      : <tspan fill="#F8FAFC">Docker / Linux / Cloud</tspan></text>
        </g>

        <!-- System Logs -->
        <g transform="translate(0, 290)" font-size="12">
          <text x="0" y="0" fill="#10B981">&gt; SYSTEM.READY = TRUE</text>
          <text x="0" y="24" fill="#94A3B8">&gt; LOADING MODULES...</text>
          <text x="0" y="48" fill="#94A3B8">&gt; INITIALIZING DEV ENV...</text>
          
          <text x="0" y="80" fill="#22D3EE">&gt; EXECUTE PROGRAM <tspan fill="#F8FAFC">--BUILD</tspan></text>
          
          <!-- Cursor -->
          <rect x="200" y="70" width="8" height="14" fill="#22D3EE">
            <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>

      <!-- Scanline Overlay -->
      <rect width="410" height="530" rx="16" fill="url(#scanlines)" pointer-events="none"/>
      
      <!-- Scanline Beam Sweep -->
      <line x1="0" y1="0" x2="410" y2="0" stroke="#22D3EE" stroke-width="2" opacity="0.3">
        <animateTransform attributeName="transform" type="translate" values="0,40; 0,510; 0,40" dur="8s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- ==================== RIGHT SIDE: MAIN TERMINAL INTERFACE ==================== -->
  <g transform="translate(475, 40)">
    <!-- Main Glass Panel -->
    <rect width="665" height="530" rx="16" fill="url(#panel-grad-dark)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Top Header Bar -->
    <path d="M 0 16 A 16 16 0 0 1 16 0 L 649 0 A 16 16 0 0 1 665 16 L 665 42 L 0 42 Z" fill="rgba(255,255,255,0.02)"/>
    <line x1="0" y1="42" x2="665" y2="42" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Window Controls & Tabs -->
    <circle cx="25" cy="21" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="40" cy="21" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="55" cy="21" r="5" fill="#10B981" opacity="0.8"/>
    
    <rect x="80" y="10" width="140" height="24" rx="6" fill="rgba(255,255,255,0.05)"/>
    <text x="150" y="26" fill="#F8FAFC" font-size="11" text-anchor="middle" class="mono">developer.json</text>

    <!-- SECTION 1: GREETING & DYNAMIC TYPING -->
    <g transform="translate(40, 85)">
      <text x="0" y="0" fill="#F8FAFC" font-size="28" class="mono" font-weight="800">Hi 👋</text>

      <!-- Animated Subtitle Typing Engine -->
      <g transform="translate(0, 36)">
        <text x="0" y="16" fill="#22D3EE" font-size="18" class="mono" font-weight="600">&gt;</text>
        <g transform="translate(24, 0)" clip-path="url(#phrase-clipper)">
          <g class="mono" font-size="16" font-weight="600" fill="url(#accent-grad-dark)">
            <animateTransform attributeName="transform" type="translate" values="0,18; 0,18; 0,-22; 0,-22; 0,-62; 0,-62; 0,-102; 0,-102; 0,18" keyTimes="0;0.22;0.25;0.47;0.50;0.72;0.75;0.97;1" dur="12s" repeatCount="indefinite"/>
            <text x="0" y="0">Middle PHP Engineer</text>
            <text x="0" y="40">Laravel &amp; High-Load Dev</text>
            <text x="0" y="80">Automation &amp; AI Integrations</text>
            <text x="0" y="120">Open Source Contributor</text>
          </g>
        </g>
      </g>
    </g>

    <!-- SECTION 2: SEQUENTIAL INFO METRICS -->
    <g transform="translate(40, 180)" class="mono" font-size="13.5">
      <text y="0" opacity="0">
        <animate attributeName="opacity" to="1" begin="0.8s" fill="freeze" dur="0.4s"/>
        <tspan fill="#94A3B8">Location     : </tspan>
        <tspan fill="#F8FAFC" font-weight="500">Europe / Remote</tspan>
      </text>

      <text y="32" opacity="0">
        <animate attributeName="opacity" to="1" begin="1.1s" fill="freeze" dur="0.4s"/>
        <tspan fill="#94A3B8">Status       : </tspan>
        <tspan fill="#F8FAFC" font-weight="500">Building scalable backend &amp; open source</tspan>
      </text>

      <text y="64" opacity="0">
        <animate attributeName="opacity" to="1" begin="1.4s" fill="freeze" dur="0.4s"/>
        <tspan fill="#94A3B8">Current Focus: </tspan>
        <tspan fill="#22D3EE" font-weight="500">Laravel Tooling, Scripting &amp; AI Workflows</tspan>
      </text>

      <text y="96" opacity="0">
        <animate attributeName="opacity" to="1" begin="1.7s" fill="freeze" dur="0.4s"/>
        <tspan fill="#94A3B8">Primary Stack: </tspan>
        <tspan fill="#F8FAFC" font-weight="500">PHP 8, Laravel, JS, MySQL, Redis, Docker</tspan>
      </text>
    </g>

    <!-- SECTION 3: SKILLS GLOWING PILLS -->
    <g transform="translate(40, 350)">
      <text x="0" y="0" fill="#94A3B8" font-size="12" class="mono" font-weight="600" letter-spacing="1">TECHS &amp; FRAMEWORKS</text>
      
      <!-- Grid Row 1 -->
      <g transform="translate(0, 18)">
        <g class="pill" transform="translate(0,0)">
          <rect width="68" height="32" rx="8" fill="#0F172A" stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1.2"/>
          <text x="34" y="20" fill="#F8FAFC" font-size="12" class="mono" text-anchor="middle" font-weight="600">PHP 8</text>
        </g>
        <g class="pill" transform="translate(80,0)">
          <rect width="88" height="32" rx="8" fill="#0F172A" stroke="#EF4444" stroke-opacity="0.4" stroke-width="1.2"/>
          <text x="44" y="20" fill="#F8FAFC" font-size="12" class="mono" text-anchor="middle" font-weight="600">Laravel</text>
        </g>
        <g class="pill" transform="translate(180,0)">
          <rect width="110" height="32" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1.2"/>
          <text x="55" y="20" fill="#F8FAFC" font-size="12" class="mono" text-anchor="middle" font-weight="600">JavaScript</text>
        </g>
        <g class="pill" transform="translate(302,0)">
          <rect width="82" height="32" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1.2"/>
          <text x="41" y="20" fill="#F8FAFC" font-size="12" class="mono" text-anchor="middle" font-weight="600">MySQL</text>
        </g>
        <g class="pill" transform="translate(396,0)">
          <rect width="74" height="32" rx="8" fill="#0F172A" stroke="#DC2626" stroke-opacity="0.4" stroke-width="1.2"/>
          <text x="37" y="20" fill="#F8FAFC" font-size="12" class="mono" text-anchor="middle" font-weight="600">Redis</text>
        </g>
      </g>

      <!-- Grid Row 2 -->
      <g transform="translate(0, 60)">
        <g class="pill" transform="translate(0,0)">
          <rect width="84" height="32" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1.2"/>
          <text x="42" y="20" fill="#F8FAFC" font-size="12" class="mono" text-anchor="middle" font-weight="600">Docker</text>
        </g>
        <g class="pill" transform="translate(96,0)">
          <rect width="58" height="32" rx="8" fill="#0F172A" stroke="#F97316" stroke-opacity="0.4" stroke-width="1.2"/>
          <text x="29" y="20" fill="#F8FAFC" font-size="12" class="mono" text-anchor="middle" font-weight="600">Git</text>
        </g>
        <g class="pill" transform="translate(166,0)">
          <rect width="98" height="32" rx="8" fill="#0F172A" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.2"/>
          <text x="49" y="20" fill="#F8FAFC" font-size="12" class="mono" text-anchor="middle" font-weight="600">REST API</text>
        </g>
        <g class="pill" transform="translate(276,0)">
          <rect width="90" height="32" rx="8" fill="#0F172A" stroke="#EC4899" stroke-opacity="0.4" stroke-width="1.2"/>
          <text x="45" y="20" fill="#F8FAFC" font-size="12" class="mono" text-anchor="middle" font-weight="600">AI APIs</text>
        </g>
        <g class="pill" transform="translate(378,0)">
          <rect width="86" height="32" rx="8" fill="#0F172A" stroke="#22C55E" stroke-opacity="0.4" stroke-width="1.2"/>
          <text x="43" y="20" fill="#F8FAFC" font-size="12" class="mono" text-anchor="middle" font-weight="600">Node.js</text>
        </g>
      </g>
    </g>
  </g>
</svg>
