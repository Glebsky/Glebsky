<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%" style="background:transparent; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="accent-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB; #06B6D4; #10B981; #2563EB" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4; #10B981; #2563EB; #06B6D4" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981; #2563EB; #06B6D4; #10B981" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="ascii-grad-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glass Panel Backgrounds -->
    <linearGradient id="panel-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Shimmer Border Gradient -->
    <linearGradient id="border-shimmer-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.12)"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.5">
        <animate attributeName="stop-opacity" values="0.2; 0.7; 0.2" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="rgba(15,23,42,0.05)"/>
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-shadow-light" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>

    <!-- Ambient Floating Orbs -->
    <radialGradient id="orb-blue-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-cyan-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <!-- Scanline Mask -->
    <pattern id="scanlines-light" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#0F172A" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <clipPath id="phrase-clipper-light">
      <rect x="0" y="-2" width="550" height="26"/>
    </clipPath>

    <style>
      .mono { font-family: 'Fira Code', 'Courier New', Courier, monospace; }
      .pill { transition: all 0.3s ease; cursor: pointer; }
      .pill:hover { filter: url(#glow-light); }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1180" height="610" rx="24" fill="url(#bg-grad-light)"/>

  <!-- Ambient Glowing Background Orbs -->
  <circle cx="200" cy="150" r="280" fill="url(#orb-blue-light)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 30,20; 0,0" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="450" r="320" fill="url(#orb-cyan-light)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -40,-30; 0,0" dur="15s" repeatCount="indefinite"/>
  </circle>

  <!-- Outer Glass Frame -->
  <rect x="20" y="20" width="1140" height="570" rx="20" fill="none" stroke="url(#border-shimmer-light)" stroke-width="1.5" filter="url(#soft-shadow-light)"/>

  <!-- ==================== LEFT SIDE: ASCII TERMINAL (38%) ==================== -->
  <g transform="translate(40, 40)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="6s" repeatCount="indefinite" ease="easeInOut"/>
      
      <!-- Panel Base -->
      <rect width="410" height="530" rx="16" fill="url(#panel-grad-light)" stroke="rgba(15,23,42,0.08)" stroke-width="1"/>
      
      <!-- Glass Highlight Header -->
      <path d="M 0 16 A 16 16 0 0 1 16 0 L 394 0 A 16 16 0 0 1 410 16 L 410 40 L 0 40 Z" fill="rgba(255,255,255,0.6)"/>
      <line x1="0" y1="40" x2="410" y2="40" stroke="rgba(15,23,42,0.06)" stroke-width="1"/>

      <!-- Window Controls -->
      <circle cx="25" cy="20" r="5" fill="#EF4444" opacity="0.8"/>
      <circle cx="40" cy="20" r="5" fill="#F59E0B" opacity="0.8"/>
      <circle cx="55" cy="20" r="5" fill="#10B981" opacity="0.8"/>
      <text x="205" y="24" fill="#475569" font-size="11" text-anchor="middle" class="mono" opacity="0.8">glebsky.asc — 80x24</text>

      <!-- ASCII Portrait Content -->
      <g transform="translate(25, 75)" fill="url(#ascii-grad-light)" class="mono" font-size="9.5" font-weight="bold" letter-spacing="1.2">
        <text y="0" opacity="0">  ██████╗ ██╗     ██████╗ ██████╗ ███████╗██╗██╗<animate attributeName="opacity" to="1" begin="0.2s" fill="freeze" dur="0.1s"/></text>
        <text y="14" opacity="0"> ██╔════╝ ██║     ██╔════╝██╔══██╗██╔════╝██║██║<animate attributeName="opacity" to="1" begin="0.3s" fill="freeze" dur="0.1s"/></text>
        <text y="28" opacity="0"> ██║  ███╗██║     █████╗  ██████╔╝███████╗██║██║<animate attributeName="opacity" to="1" begin="0.4s" fill="freeze" dur="0.1s"/></text>
        <text y="42" opacity="0"> ██║   ██║██║     ██╔══╝  ██╔══██╗╚════██║██║██║<animate attributeName="opacity" to="1" begin="0.5s" fill="freeze" dur="0.1s"/></text>
        <text y="56" opacity="0"> ╚██████╔╝███████╗███████╗██████╔╝███████║██║██║<animate attributeName="opacity" to="1" begin="0.6s" fill="freeze" dur="0.1s"/></text>
        <text y="70" opacity="0">  ╚═════╝ ╚══════╝╚══════╝╚═════╝ ╚══════╝╚═╝╚═╝<animate attributeName="opacity" to="1" begin="0.7s" fill="freeze" dur="0.1s"/></text>

        <text y="100" opacity="0">      .───────────────────────────────────.      <animate attributeName="opacity" to="1" begin="0.9s" fill="freeze" dur="0.1s"/></text>
        <text y="114" opacity="0">     /   ▄▄▄▄▄             ▄▄▄▄▄         \     <animate attributeName="opacity" to="1" begin="1.0s" fill="freeze" dur="0.1s"/></text>
        <text y="128" opacity="0">    |   ███████╗         ███████╗         |    <animate attributeName="opacity" to="1" begin="1.1s" fill="freeze" dur="0.1s"/></text>
        <text y="142" opacity="0">    |   ██╔══██║         ██╔══██║         |    <animate attributeName="opacity" to="1" begin="1.2s" fill="freeze" dur="0.1s"/></text>
        <text y="156" opacity="0">    |   ███████║  █████╗ ███████║         |    <animate attributeName="opacity" to="1" begin="1.3s" fill="freeze" dur="0.1s"/></text>
        <text y="170" opacity="0">    |   ██╔══██║  ╚════╝ ██╔══██║         |    <animate attributeName="opacity" to="1" begin="1.4s" fill="freeze" dur="0.1s"/></text>
        <text y="184" opacity="0">    |   ██║  ██║         ██║  ██║         |    <animate attributeName="opacity" to="1" begin="1.5s" fill="freeze" dur="0.1s"/></text>
        <text y="198" opacity="0">     \  ╚═╝  ╚═╝         ╚═╝  ╚═╝        /     <animate attributeName="opacity" to="1" begin="1.6s" fill="freeze" dur="0.1s"/></text>
        <text y="212" opacity="0">      `───────────────────────────────────'      <animate attributeName="opacity" to="1" begin="1.7s" fill="freeze" dur="0.1s"/></text>
        <text y="235" opacity="0">          [ FULL STACK ARCHITECTURE ]            <animate attributeName="opacity" to="1" begin="1.9s" fill="freeze" dur="0.1s"/></text>
        <text y="250" opacity="0">          [  PHP / LARAVEL / JS / GO  ]          <animate attributeName="opacity" to="1" begin="2.0s" fill="freeze" dur="0.1s"/></text>
        <text y="275" opacity="0"> &gt; SYSTEM.READY = TRUE                           <animate attributeName="opacity" to="1" begin="2.2s" fill="freeze" dur="0.1s"/></text>
        <text y="290" opacity="0"> &gt; INITIALIZING DEV ENVIRONMENT...                <animate attributeName="opacity" to="1" begin="2.4s" fill="freeze" dur="0.1s"/></text>
        
        <!-- Terminal Cursor -->
        <rect x="250" y="280" width="7" height="12" fill="#0284C7">
          <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Scanline Overlay -->
      <rect width="410" height="530" rx="16" fill="url(#scanlines-light)" pointer-events="none"/>
      
      <!-- Scanline Beam Sweep -->
      <line x1="0" y1="0" x2="410" y2="0" stroke="#0284C7" stroke-width="2" opacity="0.2">
        <animateTransform attributeName="transform" type="translate" values="0,40; 0,510; 0,40" dur="8s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- ==================== RIGHT SIDE: MAIN TERMINAL INTERFACE ==================== -->
  <g transform="translate(475, 40)">
    <!-- Main Glass Panel -->
    <rect width="665" height="530" rx="16" fill="url(#panel-grad-light)" stroke="rgba(15,23,42,0.08)" stroke-width="1"/>
    
    <!-- Top Header Bar -->
    <path d="M 0 16 A 16 16 0 0 1 16 0 L 649 0 A 16 16 0 0 1 665 16 L 665 42 L 0 42 Z" fill="rgba(255,255,255,0.5)"/>
    <line x1="0" y1="42" x2="665" y2="42" stroke="rgba(15,23,42,0.06)" stroke-width="1"/>

    <!-- Controls & Tab -->
    <circle cx="25" cy="21" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="40" cy="21" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="55" cy="21" r="5" fill="#10B981" opacity="0.8"/>
    
    <rect x="80" y="10" width="140" height="24" rx="6" fill="rgba(15,23,42,0.04)"/>
    <text x="150" y="26" fill="#0F172A" font-size="11" text-anchor="middle" class="mono">developer.json</text>

    <!-- SECTION 1: GREETING & DYNAMIC TYPING -->
    <g transform="translate(40, 85)">
      <text x="0" y="0" fill="#475569" font-size="20" class="mono" font-weight="500">Hi 👋, I'm <tspan fill="#0F172A" font-size="28" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Glebsky</tspan></text>

      <g transform="translate(0, 36)">
        <text x="0" y="16" fill="#2563EB" font-size="18" class="mono" font-weight="600">&gt;</text>
        <g transform="translate(24, 0)" clip-path="url(#phrase-clipper-light)">
          <g class="mono" font-size="16" font-weight="600" fill="url(#accent-grad-light)">
            <animateTransform attributeName="transform" type="translate" values="0,18; 0,18; 0,-22; 0,-22; 0,-62; 0,-62; 0,-102; 0,-102; 0,18" keyTimes="0;0.22;0.25;0.47;0.50;0.72;0.75;0.97;1" dur="12s" repeatCount="indefinite"/>
            <text x="0" y="0">Backend &amp; Full Stack Engineer</text>
            <text x="0" y="40">PHP &amp; Laravel Specialist</text>
            <text x="0" y="80">Automation &amp; Scripting Dev</text>
            <text x="0" y="120">Open Source Contributor</text>
          </g>
        </g>
      </g>
    </g>

    <!-- SECTION 2: SEQUENTIAL INFO METRICS -->
    <g transform="translate(40, 180)" class="mono" font-size="13.5">
      <text y="0" opacity="0">
        <animate attributeName="opacity" to="1" begin="0.8s" fill="freeze" dur="0.4s"/>
        <tspan fill="#475569">Location     : </tspan>
        <tspan fill="#0F172A" font-weight="600">London / Remote</tspan>
      </text>

      <text y="32" opacity="0">
        <animate attributeName="opacity" to="1" begin="1.1s" fill="freeze" dur="0.4s"/>
        <tspan fill="#475569">Status       : </tspan>
        <tspan fill="#0F172A" font-weight="600">Studying coding &amp; Building open source</tspan>
      </text>

      <text y="64" opacity="0">
        <animate attributeName="opacity" to="1" begin="1.4s" fill="freeze" dur="0.4s"/>
        <tspan fill="#475569">Current Focus: </tspan>
        <tspan fill="#2563EB" font-weight="600">Laravel Packages &amp; Developer Tooling</tspan>
      </text>

      <text y="96" opacity="0">
        <animate attributeName="opacity" to="1" begin="1.7s" fill="freeze" dur="0.4s"/>
        <tspan fill="#475569">Primary Stack: </tspan>
        <tspan fill="#0F172A" font-weight="600">PHP, JavaScript, SQL, Web Architectures</tspan>
      </text>
    </g>

    <!-- SECTION 3: SKILLS GLOWING PILLS -->
    <g transform="translate(40, 350)">
      <text x="0" y="0" fill="#475569" font-size="12" class="mono" font-weight="600" letter-spacing="1">TECHS &amp; FRAMEWORKS</text>
      
      <!-- Grid Row 1 -->
      <g transform="translate(0, 18)">
        <g class="pill" transform="translate(0,0)">
          <rect width="68" height="32" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-opacity="0.3" stroke-width="1.2"/>
          <text x="34" y="20" fill="#0F172A" font-size="12" class="mono" text-anchor="middle" font-weight="600">PHP</text>
        </g>
        <g class="pill" transform="translate(80,0)">
          <rect width="88" height="32" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-opacity="0.3" stroke-width="1.2"/>
          <text x="44" y="20" fill="#0F172A" font-size="12" class="mono" text-anchor="middle" font-weight="600">Laravel</text>
        </g>
        <g class="pill" transform="translate(180,0)">
          <rect width="110" height="32" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-opacity="0.3" stroke-width="1.2"/>
          <text x="55" y="20" fill="#0F172A" font-size="12" class="mono" text-anchor="middle" font-weight="600">JavaScript</text>
        </g>
        <g class="pill" transform="translate(302,0)">
          <rect width="82" height="32" rx="8" fill="#FFFFFF" stroke="#0891B2" stroke-opacity="0.3" stroke-width="1.2"/>
          <text x="41" y="20" fill="#0F172A" font-size="12" class="mono" text-anchor="middle" font-weight="600">MySQL</text>
        </g>
        <g class="pill" transform="translate(396,0)">
          <rect width="74" height="32" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-opacity="0.3" stroke-width="1.2"/>
          <text x="37" y="20" fill="#0F172A" font-size="12" class="mono" text-anchor="middle" font-weight="600">Redis</text>
        </g>
      </g>

      <!-- Grid Row 2 -->
      <g transform="translate(0, 60)">
        <g class="pill" transform="translate(0,0)">
          <rect width="84" height="32" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-opacity="0.3" stroke-width="1.2"/>
          <text x="42" y="20" fill="#0F172A" font-size="12" class="mono" text-anchor="middle" font-weight="600">Docker</text>
        </g>
        <g class="pill" transform="translate(96,0)">
          <rect width="58" height="32" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-opacity="0.3" stroke-width="1.2"/>
          <text x="29" y="20" fill="#0F172A" font-size="12" class="mono" text-anchor="middle" font-weight="600">Git</text>
        </g>
        <g class="pill" transform="translate(166,0)">
          <rect width="98" height="32" rx="8" fill="#FFFFFF" stroke="#059669" stroke-opacity="0.3" stroke-width="1.2"/>
          <text x="49" y="20" fill="#0F172A" font-size="12" class="mono" text-anchor="middle" font-weight="600">REST API</text>
        </g>
        <g class="pill" transform="translate(276,0)">
          <rect width="102" height="32" rx="8" fill="#FFFFFF" stroke="#DB2777" stroke-opacity="0.3" stroke-width="1.2"/>
          <text x="51" y="20" fill="#0F172A" font-size="12" class="mono" text-anchor="middle" font-weight="600">HTML/CSS</text>
        </g>
        <g class="pill" transform="translate(390,0)">
          <rect width="86" height="32" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-opacity="0.3" stroke-width="1.2"/>
          <text x="43" y="20" fill="#0F172A" font-size="12" class="mono" text-anchor="middle" font-weight="600">Node.js</text>
        </g>
      </g>
    </g>
  </g>
</svg>
